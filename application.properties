spring.application.name=keystone-backend
keystone.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*}

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/keystone
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

keystone.seed.technician-password=${TECHNICIAN_PASSWORD}
keystone.seed.dispatcher-password=${DISPATCHER_PASSWORD}
keystone.seed.customer-password=${CUSTOMER_PASSWORD}
